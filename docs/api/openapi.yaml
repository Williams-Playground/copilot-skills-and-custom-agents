openapi: 3.0.3
info:
  title: Photo Gallery API
  version: 1.0.0
  description: |
    Security-focused photo management API for the Photo Gallery & Portfolio application.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:3000
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Photos
    description: Photo management operations
paths:
  /api/photos:
    get:
      tags: [Photos]
      summary: List photos
      description: Returns paginated photos with optional filtering by tag and title search.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: tag
          in: query
          description: Filter photos by tag.
          schema:
            type: string
            example: nature
        - name: search
          in: query
          description: Case-insensitive title search.
          schema:
            type: string
            example: sunset
      responses:
        '200':
          description: Photos retrieved successfully.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoListResponse'
              examples:
                success:
                  value:
                    data:
                      - id: "1"
                        url: "/placeholder-1.jpg"
                        title: "Sunset Landscape"
                        tags: ["landscape", "sunset", "nature"]
                        likes: 124
                        downloads: 45
                        views: 1205
                        photographer: "John Doe"
                        dateTaken: "2024-01-15"
                    pagination:
                      page: 1
                      limit: 20
                      total: 1
                      totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Photos]
      summary: Upload a new photo
      description: |
        Uploads a new image and metadata.
        Validation constraints:
        - Allowed MIME types: image/jpeg, image/png, image/gif, image/webp
        - Maximum file size: 10MB
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG, GIF, WebP), max 10MB.
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
                tags:
                  type: array
                  items:
                    type: string
                  maxItems: 20
                photographer:
                  type: string
                  maxLength: 120
                dateTaken:
                  type: string
                  format: date
            encoding:
              file:
                contentType: image/jpeg, image/png, image/gif, image/webp
      responses:
        '201':
          description: Photo uploaded successfully.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoResponse'
              examples:
                created:
                  value:
                    data:
                      id: "10"
                      url: "/uploads/photo-10.webp"
                      title: "City Lights"
                      tags: ["city", "night"]
                      likes: 0
                      downloads: 0
                      views: 0
                      photographer: "Alex Brown"
                      dateTaken: "2024-02-01"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/photos/{id}:
    get:
      tags: [Photos]
      summary: Get photo by ID
      parameters:
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '200':
          description: Photo retrieved successfully.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Photos]
      summary: Update photo metadata
      parameters:
        - $ref: '#/components/parameters/PhotoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePhotoRequest'
            examples:
              updateMetadata:
                value:
                  title: "Updated Title"
                  tags: ["nature", "featured"]
                  photographer: "Jane Smith"
                  dateTaken: "2024-02-10"
      responses:
        '200':
          description: Photo updated successfully.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Photos]
      summary: Delete photo
      parameters:
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '200':
          description: Photo deleted successfully.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePhotoResponse'
              examples:
                deleted:
                  value:
                    message: "Photo deleted successfully"
                    id: "10"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/photos/{id}/like:
    post:
      tags: [Photos]
      summary: Increment like count
      parameters:
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '200':
          description: Like count incremented.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/photos/{id}/download:
    get:
      tags: [Photos]
      summary: Download photo
      parameters:
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '200':
          description: Binary file download stream.
          headers:
            Content-Disposition:
              description: Suggested filename for downloaded file.
              schema:
                type: string
                example: attachment; filename="sunset-landscape.jpg"
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide a valid JWT access token.
  parameters:
    PhotoId:
      name: id
      in: path
      required: true
      description: Unique photo identifier.
      schema:
        type: string
        minLength: 1
      example: "1"
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    XRateLimitLimit:
      description: Total requests allowed in the current window.
      schema:
        type: integer
        example: 100
    XRateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
        example: 99
    XRateLimitReset:
      description: Unix timestamp when the current window resets.
      schema:
        type: integer
        example: 1719931200
  schemas:
    Photo:
      type: object
      required:
        - id
        - url
        - title
        - tags
        - likes
        - downloads
        - views
      properties:
        id:
          type: string
          example: "1"
        url:
          type: string
          format: uri-reference
          example: "/placeholder-1.jpg"
        title:
          type: string
          minLength: 1
          maxLength: 120
          example: Sunset Landscape
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40
          example: [landscape, sunset, nature]
        likes:
          type: integer
          minimum: 0
          example: 124
        downloads:
          type: integer
          minimum: 0
          example: 45
        views:
          type: integer
          minimum: 0
          example: 1205
        photographer:
          type: string
          maxLength: 120
          nullable: true
          example: John Doe
        dateTaken:
          type: string
          format: date
          nullable: true
          example: "2024-01-15"
    PhotoResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Photo'
    PhotoListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        pagination:
          type: object
          required: [page, limit, total, totalPages]
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              example: 50
            totalPages:
              type: integer
              example: 3
    UpdatePhotoRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40
        photographer:
          type: string
          maxLength: 120
        dateTaken:
          type: string
          format: date
      minProperties: 1
    DeletePhotoResponse:
      type: object
      required: [message, id]
      properties:
        message:
          type: string
          example: Photo deleted successfully
        id:
          type: string
          example: "10"
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: ValidationError
        message:
          type: string
          example: Invalid request payload
        details:
          type: array
          items:
            type: string
          example:
            - title is required
  responses:
    BadRequest:
      description: Invalid request parameters or payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            badRequest:
              value:
                error: BadRequest
                message: Query parameter "page" must be greater than 0
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                error: Unauthorized
                message: Authentication token is missing or invalid
    Forbidden:
      description: Authenticated user is not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                error: Forbidden
                message: You do not have permission to perform this action
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                error: NotFound
                message: Photo not found
    PayloadTooLarge:
      description: Uploaded file exceeds 10MB limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            tooLarge:
              value:
                error: PayloadTooLarge
                message: File size exceeds 10MB limit
    UnprocessableEntity:
      description: Request body failed semantic validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidType:
              value:
                error: ValidationError
                message: Unsupported image type
                details:
                  - Allowed types: image/jpeg, image/png, image/gif, image/webp
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            serverError:
              value:
                error: InternalServerError
                message: An unexpected error occurred
